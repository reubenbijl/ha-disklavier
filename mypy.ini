# Strict typing, which the platinum quality scale requires.
#
# Everything --strict turns on is enabled except implicit re-export. That one is not about
# this integration's own typing: homeassistant.components.media_player re-exports names
# such as BrowseMedia and MediaPlayerState without declaring __all__, so forbidding
# implicit re-export would only report Home Assistant's export hygiene, not ours.
[mypy]
# Home Assistant itself now uses 3.14 syntax, so anything lower fails parsing its source.
python_version = 3.14
warn_unused_configs = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = False
strict_equality = True
extra_checks = True
warn_unreachable = True

